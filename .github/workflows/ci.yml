name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# Action majors as of October 2026 (Node 24 runtime); see deploy.yml for the runner note.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
