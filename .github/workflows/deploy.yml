name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

# Action majors as of October 2026; each runs on Node 24, which the runner now requires
# (Node 20 actions are forced onto Node 24 with a warning). `ubuntu-latest` moves to
# Ubuntu 26.04 in November 2026 (actions/runner-images#14748); nothing here depends on the
# Ubuntu version, so the label stays.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
