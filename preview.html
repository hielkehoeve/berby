<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berby graphics preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ffc3d2;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        padding: 4px 8px;
        background: rgba(58, 35, 64, 0.65);
        color: #fff4e6;
        font-size: 12px;
        border-radius: 6px;
        pointer-events: none;
        white-space: pre;
      }
      #help {
        position: fixed;
        left: 8px;
        bottom: 8px;
        padding: 4px 8px;
        background: rgba(58, 35, 64, 0.5);
        color: #fff4e6;
        font-size: 11px;
        border-radius: 6px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <div id="help">C chase/orbit · T top view · Space pause · R restart · ←/→ scrub · ↑/↓ speed · W wireframe</div>
    <script type="module" src="./src/graphics/preview.ts"></script>
  </body>
</html>
